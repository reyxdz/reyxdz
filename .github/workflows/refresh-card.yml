# Daily refresh for the gh-ascii neofetch card (stars / uptime / languages).
name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download both themes
        env:
          HANDLE: reyxdz
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark" \
            -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light" \
            -o light_mode.svg

      # gh-ascii only reports coding languages; rewrite to spoken languages.
      - name: Use spoken languages
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          NEW = " English, Filipino, Bisayawa"
          DOTS = "." * 15
          pattern = re.compile(
              r'(<tspan fill="[^"]+">\. Languages: </tspan><tspan fill="[^"]+">)'
              r'[.]+'
              r'(</tspan><tspan fill="[^"]+">)'
              r'[^<]*'
              r'(</tspan>)'
          )
          replacement = rf"\g<1>{DOTS}\g<2>{NEW}\g<3>"

          for name in ("dark_mode.svg", "light_mode.svg"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              updated, n = pattern.subn(replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f"failed to patch Languages in {name}")
              path.write_text(updated, encoding="utf-8")
              print(f"patched {name}")
          PY

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged — nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi
