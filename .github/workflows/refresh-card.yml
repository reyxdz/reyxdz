# Daily refresh for the gh-ascii neofetch card (stars / uptime / languages).
name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download both themes
        env:
          HANDLE: reyxdz
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark" \
            -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light" \
            -o light_mode.svg

      # Customizations: spoken languages, email, sparkline width-locked to Private row.
      - name: Apply card customizations
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          CHAR_EM = 0.6  # Consolas/Menlo advance width

          lang_pattern = re.compile(
              r'(<tspan fill="[^"]+">\. Languages: </tspan><tspan fill="[^"]+">)'
              r'[.]+'
              r'(</tspan><tspan fill="[^"]+">)'
              r'[^<]*'
              r'(</tspan>)'
          )
          lang_repl = rf'\g<1>{"." * 15}\g<2> English, Filipino, Bisayawa\g<3>'

          contact_pattern = re.compile(
              r'(<tspan fill="[^"]+">)\. GitHub: (</tspan><tspan fill="[^"]+">)'
              r'[.]+'
              r'(</tspan><tspan fill="[^"]+">)'
              r'[^<]*'
              r'(</tspan>)'
          )
          contact_repl = (
              rf'\g<1>. Email: \g<2>{"." * 28}\g<3> reyfdenzo@gmail.com\g<4>'
          )

          sparkline_text = re.compile(
              r'<text([^>]*)y="443"([^>]*)>(.*?)</text>',
              re.S,
          )
          sparkline_tspan = re.compile(
              r'(<tspan fill="#[0-9a-fA-F]+">)([^<]*[\u2581-\u2588][^<]*)(</tspan>)'
          )

          def align_sparkline(text: str) -> str:
              priv_m = re.search(r'<text[^>]*y="423"[^>]*>(.*?)</text>', text, re.S)
              if not priv_m:
                  raise SystemExit("Private row missing")
              priv_plain = re.sub(r"<[^>]+>", "", priv_m.group(1))
              fs_m = re.search(r'<text[^>]*y="423"[^>]*font-size="([^"]+)"', text)
              if not fs_m:
                  fs_m = re.search(r'<text[^>]*font-size="([^"]+)"[^>]*y="423"', text)
              font_size = float(fs_m.group(1)) if fs_m else 16.0
              target_width = round(len(priv_plain) * font_size * CHAR_EM, 2)

              def repl_text(match: re.Match[str]) -> str:
                  attrs = match.group(1) + match.group(2)
                  body = match.group(3)
                  # strip old textLength/lengthAdjust if present
                  attrs = re.sub(r'\s*textLength="[^"]*"', "", attrs)
                  attrs = re.sub(r'\s*lengthAdjust="[^"]*"', "", attrs)
                  attrs = attrs.rstrip() + (
                      f' textLength="{target_width}" lengthAdjust="spacingAndGlyphs"'
                  )

                  def repl_tspan(tm: re.Match[str]) -> str:
                      return f"{tm.group(1)}{tm.group(2).strip(' ')}{tm.group(3)}"

                  body2, n = sparkline_tspan.subn(repl_tspan, body, count=1)
                  if n != 1:
                      raise SystemExit("sparkline tspan missing on y=443")
                  return f"<text{attrs}>{body2}</text>"

              updated, n = sparkline_text.subn(repl_text, text, count=1)
              if n != 1:
                  raise SystemExit("sparkline text row y=443 missing")
              return updated

          for name in ("dark_mode.svg", "light_mode.svg"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text, n1 = lang_pattern.subn(lang_repl, text, count=1)
              text, n2 = contact_pattern.subn(contact_repl, text, count=1)
              if n1 != 1 or n2 != 1:
                  raise SystemExit(f"failed patches in {name}: lang={n1} contact={n2}")
              text = align_sparkline(text)
              path.write_text(text, encoding="utf-8", newline="\n")
              print(f"patched {name}")
          PY

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged — nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi
