# Daily refresh for the gh-ascii neofetch card (stars / uptime / languages).
name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download both themes
        env:
          HANDLE: reyxdz
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark" \
            -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light" \
            -o light_mode.svg

      # Customizations: spoken languages, email, and drop the contribution sparkline.
      - name: Apply card customizations
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          lang_pattern = re.compile(
              r'(<tspan fill="[^"]+">\. Languages: </tspan><tspan fill="[^"]+">)'
              r'[.]+'
              r'(</tspan><tspan fill="[^"]+">)'
              r'[^<]*'
              r'(</tspan>)'
          )
          lang_repl = rf'\g<1>{"." * 15}\g<2> English, Filipino, Bisayawa\g<3>'

          contact_pattern = re.compile(
              r'(<tspan fill="[^"]+">)\. GitHub: (</tspan><tspan fill="[^"]+">)'
              r'[.]+'
              r'(</tspan><tspan fill="[^"]+">)'
              r'[^<]*'
              r'(</tspan>)'
          )
          contact_repl = (
              rf'\g<1>. Email: \g<2>{"." * 28}\g<3> reyfdenzo@gmail.com\g<4>'
          )

          sparkline_pattern = re.compile(
              r'\n?[ \t]*<text[^>]*>\s*<tspan fill="#[0-9a-fA-F]+">[^<]*'
              r'[\u2581-\u2588][^<]*</tspan>\s*</text>',
              re.S,
          )

          for name in ("dark_mode.svg", "light_mode.svg"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text, n1 = lang_pattern.subn(lang_repl, text, count=1)
              text, n2 = contact_pattern.subn(contact_repl, text, count=1)
              text, n3 = sparkline_pattern.subn("", text, count=1)
              if n1 != 1 or n2 != 1 or n3 != 1:
                  raise SystemExit(
                      f"failed patches in {name}: lang={n1} contact={n2} sparkline={n3}"
                  )
              path.write_text(text, encoding="utf-8", newline="\n")
              print(f"patched {name}")
          PY

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged — nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi
